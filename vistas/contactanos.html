<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contáctanos | TrendyShop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <main class="container-fluid mt-4">
      <h1 class="mb-4">Contáctanos</h1>

      <form id="contact-form" class="border rounded p-3 shadow-sm">
        <div class="mb-3">
          <label for="nombre" class="form-label fw-semibold">Nombre</label>
          <input id="nombre" name="nombre" type="text" class="form-control" autocomplete="name" required />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Correo electrónico</label>
          <input id="email" name="email" type="email" class="form-control" autocomplete="email" required />
        </div>

        <div class="mb-3">
          <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
          <textarea id="mensaje" name="mensaje" class="form-control" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enviar mensaje</button>
      </form>
    </main>
  </body>
</html>
