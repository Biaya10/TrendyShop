<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>catalogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <!-- Navbar del catalogo -->
    <div class="container-fluid">

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">

                <a class="navbar-brand" href="#">Catalogo</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="men's clothing nav-item">
                            <a class="nav-link active" aria-current="page" href="#" data-categoria="caballeros">
                                Caballeros
                            </a>
                        </li>

                        <li class="women's clothing nav-item">
                            <a class="nav-link" href="#" data-categoria="damas">
                                Damas
                            </a>
                        </li>

                        <li class="jewelery nav-item">
                            <a class="nav-link" href="#" data-categoria="accesorios">
                                Accesorios
                            </a>
                        </li>

                        <!--
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-categoria="promociones">
                                Promociones
                            </a>
                        </li>
                        -->

                    </ul>

                    <form class="d-flex" role="search" id="formBuscar">
                        <input class="form-control me-2" type="search" id="buscarProducto" placeholder="Buscar"
                            aria-label="Buscar productos">

                        <button class="btn btn-outline-success" type="submit">
                            Buscar
                        </button>
                    </form>

                </div>
            </div>
        </nav>

    </div>


    <!-- Contenido del catalogo -->
    <div class="container-fluid mt-4">

        <!-- Caballeros -->
        <section id="caballeros" class="categoria">

            <div class="row row-cols-2 row-cols-sm-2
                    row-cols-lg-3 row-cols-xl-4 g-4">
                    


                <div class="col">
                    <div class="card h-100">
                        <img src="../img/pngwing.com.png" class="card-img-top" alt="Camisa para caballero">

                        <div class="card-body">
                            <h5 class="card-title">Camisa</h5>
                            <p class="card-text">$50.000</p>
                            <button type="button" class="btn btn-primary btn-sm">agregar al carrito</button>
                        </div>
                    </div>
                </div>



            </div>
        </section>

        <!-- Damas -->
        <section id="damas" class="categoria d-none">
            <div class="row row-cols-2 row-cols-lg-3
                    row-cols-xl-4 g-4">

                <div class="col">
                    <div class="card h-100">
                        <img src="../img/dama.png" class="card-img-top" alt="Camisa para dama">

                        <div class="card-body">
                            <h5 class="card-title">Camisa</h5>
                            <p class="card-text">$60.000</p>
                            <button type="button" class="btn btn-primary btn-sm">Agregar al carrito</button>
                        </div>
                    </div>
                </div>


            </div>
        </section>

        <!-- Accesorios -->
        <section id="accesorios" class="categoria d-none">
            <div class="row row-cols-2 row-cols-lg-3
                    row-cols-xl-4 g-4">

                <div class="col">
                    <div class="card h-100">
                        <img src="../img/pngwing.com.png" class="card-img-top" alt="Calsetines">

                        <div class="card-body">
                            <h5 class="card-title">Camisa</h5>
                            <p class="card-text">$20.000</p>
                            <button type="button" class="btn btn-primary btn-sm">agregar al carrito</button>
                        </div>
                    </div>
                </div>


            </div>
        </section>

        <!-- Promociones -->
        <section id="promociones" class="categoria d-none">
            <div class="row row-cols-2 row-cols-lg-3
                    row-cols-xl-4 g-4">

                <div class="col">
                    <div class="card h-100">
                        <img src="imagenes/camisa.jpg" class="card-img-top" alt="Reloj">

                        <div class="card-body">
                            <h5 class="card-title">Camisa</h5>
                            <p class="card-text">$80.000</p>
                            <button type="button" class="btn btn-primary btn-sm">agregar al carrito</button>
                        </div>
                    </div>
                </div>


            </div>
        </section>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="../script-catalogo.js"></script>
</body>

</html>
