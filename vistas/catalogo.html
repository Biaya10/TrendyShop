<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>catalogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <!-- Navbar del catalogo -->
    <div class="container-fluid">

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">

                <a class="navbar-brand" href="#">Catalogo</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <div class="me-auto d-flex align-items-center gap-2 mb-2 mb-lg-0">
                        <label for="filtro-categoria" class="form-label m-0">Categoría</label>
                        <select id="filtro-categoria" class="form-select form-select-sm w-auto">
                            <option value="todos">Todos</option>
                            <option value="men's clothing">Hombre</option>
                            <option value="women's clothing">Mujer</option>
                            <option value="jewelery">Joyería</option>
                        </select>
                    </div>

                    <form class="d-flex" role="search" id="formBuscar">
                        <input class="form-control me-2" type="search" id="buscarProducto" placeholder="Buscar"
                            aria-label="Buscar productos">

                        <button class="btn btn-outline-success" type="submit">
                            Buscar
                        </button>
                    </form>

                </div>
            </div>
        </nav>

    </div>


    <!-- Contenido del catalogo -->
    <div class="container-fluid mt-4">
        <p id="mensaje-carga" hidden>Cargando productos...</p>
        <p id="mensaje-error" hidden>No pudimos conectar con la tienda. Mostrando productos de respaldo.</p>

        <div class="container-tarjetas row row-cols-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<script type="module" src="../js/main.js"></script>
</body>

</html>
