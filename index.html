<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendyShop | Tienda en Línea</title>
    
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Iconos RemixIcon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- Tus hojas de estilo personales -->
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>

 
    <!-- CONTENEDOR PRINCIPAL DE LA BARRA FIJA (NAVBAR)    -->
    
    <header class="navbar navbar-expand-lg sticky-top navbar-personalizada shadow-lg">
        
        <!-- Uso de container-fluid respetado al 100% -->
        <div class="container-fluid px-4 px-md-5">
            
            <!-- 1. BLOQUE DIV: LOGO DE LA EMPRESA -->
            <div class="contenedor-logo">
                <a href="index.html" class="navbar-brand d-flex align-items-center gap-2 m-0">
                    <span class="badge fs-5 p-2 text-dark estilo-badge-logo">TS</span>
                    <span class="logo-texto">TRENDY<span class="logo-resaltado">SHOP</span></span>
                </a>
            </div>

            <!-- 2. BLOQUE DIV: BOTÓN PARA CELULARES (HAMBURGUESA) -->
            <div class="contenedor-boton-movil">
                <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <!-- 3. BLOQUE DIV: MENÚ CON LAS OPCIONES DE NAVEGACIÓN -->
            <div class="collapse navbar-collapse" id="menuNavegacion">
                
                <!-- Sub-contenedor para empujar las opciones a la derecha -->
                <div class="ms-auto">
                    <ul class="navbar-nav align-items-center gap-3">
                        
                        <!-- Opción 1: Inicio -->
                        <li class="nav-item">
                            <div class="contenedor-enlace">
                                <a class="nav-link enlace-menu-personalizado active" href="index.html">Inicio</a>
                            </div>
                        </li>
                        
                        <!-- Opción 2: Catálogo -->
                        <li class="nav-item">
                            <div class="contenedor-enlace">
                                <a class="nav-link enlace-menu-personalizado" href="vistas/catalogo.html">Catálogo</a>
                            </div>
                        </li>
                        
                        <!-- Opción 3: Quiénes Somos -->
                        <li class="nav-item">
                            <div class="contenedor-enlace">
                                <a class="nav-link enlace-menu-personalizado" href="vistas/quienes_somos.html">Quiénes Somos</a>
                            </div>
                        </li>
                        
                        <!-- Opción 4: Contáctanos -->
                        <li class="nav-item">
                            <div class="contenedor-enlace">
                                <a class="nav-link enlace-menu-personalizado" href="vistas/contactanos.html">Contáctanos</a>
                            </div>
                        </li>
                        
                        <!-- Opción 5: Carrito de Compras -->
                        <li class="nav-item">
                            <div class="contenedor-boton-carrito">
                                <a class="btn boton-carrito-personalizado d-flex align-items-center gap-2" href="vistas/carrito_compras.html">
                                    <i class="ri-shopping-bag-3-fill fs-5"></i>
                                    <span>Carrito de Compras</span>
                                    <span id="cart-count" class="badge bg-dark text-white rounded-pill ms-1">0</span>
                                </a>
                            </div>
                        </li>

                    </ul>
                </div>

            </div>

        </div>
    </header>

    <!-- Espacio temporal para probar cómo se ve -->
    <div class="container-fluid py-5 my-5 text-center">
        <h3 class="text-secondary">Prueba de visualización del Navbar...</h3>
    </div>

    <!-- JS de Bootstrap y Script personal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scrip.js"></script>
</body>
</html>
